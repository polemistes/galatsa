#
# Runs the same checks as `pnpm check` on Linux, Windows and macOS, then builds.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Actions are pinned to the full commit SHA of a release that was at least two
      # weeks old when chosen (2026-11-26); the tag is in the comment. A tag can be
      # moved, a commit SHA cannot. pnpm/action-setup supports pnpm 12 from v6.1.0.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job only reads the code; do not leave a token in .git/config.
          persist-credentials: false

      # Reads the pnpm version from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm check` does not need a build: workspace packages are read from source.
      # Its release-age check asks the npm registry for publish dates; GitHub sets
      # CI=true, so the check fails instead of skipping when the registry is down.
      - name: Run checks
        run: pnpm check

      - name: Build
        run: pnpm build
