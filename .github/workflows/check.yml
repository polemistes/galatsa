#
# Runs the same checks as `pnpm check` on Linux, Windows and macOS, then builds.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Actions are pinned to exact release tags that were at least two weeks old
      # when chosen (2026-11-26). pnpm/action-setup supports pnpm 12 from v6.1.0.
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      # Reads the pnpm version from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm check` does not need a build: workspace packages are read from source.
      - name: Run checks
        run: pnpm check

      - name: Build
        run: pnpm build
