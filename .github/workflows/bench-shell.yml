# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the desktop measurement app (apps/desktop) for Linux, Windows and macOS,
# unsigned, and keeps the installers as workflow artifacts for 30 days. It never
# makes a release. The app is meant to be run on real machines; the runners here
# are virtual machines without a real graphics card, so performance numbers from
# them must not be used to choose a rendering engine.

name: bench-shell

on:
  push:
    branches: ["bench-shell/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same pinned actions as check.yml (release at least two weeks old when
      # chosen; the tag is in the comment).
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run checks
        run: pnpm check
      - name: Build
        run: pnpm build

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb uses the system's WebKitGTK; the AppImage carries its own copy of
          # WebKitGTK and is only a test vehicle, not a way to measure the system's
          # engine. The plain program file is kept too: on other distributions it
          # runs with the system's WebKitGTK.
          - name: linux
            os: ubuntu-latest
            args: --bundles deb,appimage
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/galatsa-bench-shell
          - name: windows
            os: windows-latest
            args: --bundles nsis
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          # One app for Apple silicon and Intel Macs.
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            artifacts: |
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Build prerequisites from Tauri's list for Debian and Ubuntu
      # (https://v2.tauri.app/start/prerequisites/).
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Rust comes with the runner images; only the two Mac targets are added.
      - name: Add Rust targets (macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cargo.lock is committed; --locked fails instead of changing it, and the
      # build below then uses the same versions.
      - name: Test the Rust code
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Build the app
        working-directory: apps/desktop
        run: pnpm tauri build --ci ${{ matrix.args }}

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galatsa-maaling-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30
